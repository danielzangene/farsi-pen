name: Test and deploy to GitHub Pages

# One Pages site serves main plus preview branches, each in its own folder:
#   main   → https://<owner>.github.io/farsi-pen/
#   dev    → https://<owner>.github.io/farsi-pen/dev/
#   dev-ui → https://<owner>.github.io/farsi-pen/dev-ui/
# Pages only deploys from main, so a push to a preview branch asks main to
# redeploy, and every main deploy builds all of them.
# To add a preview: add the branch to `push.branches` and to PREVIEWS below.

on:
  push:
    branches: [main, dev, dev-ui]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Per-ref, so a PR or preview push never cancels a production deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push to a preview branch: test it, then redeploy from main (which rebuilds every preview).
  preview:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      BASE: /${{ github.event.repository.name }}
      PREVIEWS: dev dev-ui
      # Deploys (main) also build the preview branches; PRs only test their own code.
      DEPLOY: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE }}

      - name: Build preview branches into their folders
        if: env.DEPLOY == 'true'
        run: |
          for b in $PREVIEWS; do
            if ! git ls-remote --exit-code --heads origin "$b" >/dev/null; then
              echo "No branch $b, skipping"; continue
            fi
            git fetch --depth 1 origin "$b"
            git worktree add --detach "../src-$b" FETCH_HEAD
            (
              cd "../src-$b"
              npm ci
              NEXT_PUBLIC_BASE_PATH="$BASE/$b" NEXT_PUBLIC_CHANNEL="$b" npm run build
            )
            rm -rf "out/$b"
            cp -r "../src-$b/out" "out/$b"
          done

      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: env.DEPLOY == 'true'
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
